name: clickgas_admin
description: "ClickGas admin dashboard (Flutter web): operations, distributor approvals, prices, fees and balances."
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clickgas_core:
    path: ../../packages/clickgas_core
  supabase_flutter: ^2.17.2
  provider: ^6.1.5+1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
